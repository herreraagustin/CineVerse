<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="keywords"
      content="error 404, página no encontrada, CineVerse"
    />
    <meta
      name="description"
      content="La página que intentas visitar no existe o fue movida. Regresa al inicio de CineVerse y continúa explorando nuestro catálogo."
    />
    <meta name="author" content="DreamTeam" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link
      rel="shortcut icon"
      href="/assets/img/Logo1.png"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="/css/suscripto/reproductor.css" />
    <title>CineVerse | Reproductor</title>
  </head>
  <body>
    <main class="reproductor-main">
      <div class="reproductor-pantalla">
        <div class="reproductor-topbar">
          <a href="/pages/suscripto/inicioSus.html" class="btn-volver">
            <i class="bi bi-arrow-left"></i> Volver
          </a>
        </div>
        <div class="reproductor-error">
          <i
            class="bi bi-exclamation-triangle-fill reproductor-error-icono"
          ></i>
          <h2 class="reproductor-error-titulo">
            Se ha producido un error al cargar el contenido.
          </h2>
          <p class="reproductor-error-texto">
            No fue posible reproducir este contenido.<br />
            Inténtalo nuevamente más tarde.
          </p>
          <span class="reproductor-error-codigo">Código de error: CV-500</span>
          <button type="button" class="btn-reintentar" disabled>
            <i class="bi bi-arrow-clockwise"></i> Reintentar
          </button>
        </div>
        <div class="reproductor-controles">
          <div class="controles-progreso">
            <div class="controles-progreso-barra">
              <div class="controles-progreso-relleno"></div>
            </div>
            <div class="controles-tiempo">
              <span>00:00</span>
              <span>/</span>
              <span>00:00</span>
            </div>
          </div>
          <div class="controles-botones">
            <div class="controles-izquierda">
              <button type="button" class="btn-control" disabled>
                <i class="bi bi-skip-backward-fill"></i>
              </button>
              <button
                type="button"
                class="btn-control btn-control-play"
                disabled
              >
                <i class="bi bi-play-fill"></i>
              </button>
              <button type="button" class="btn-control" disabled>
                <i class="bi bi-skip-forward-fill"></i>
              </button>
              <button type="button" class="btn-control" disabled>
                <i class="bi bi-volume-up-fill"></i>
              </button>
            </div>
            <div class="controles-derecha">
              <button type="button" class="btn-control-texto" disabled>
                CC
              </button>
              <button type="button" class="btn-control-texto" disabled>
                Audio
              </button>
              <button type="button" class="btn-control-texto" disabled>
                HD
              </button>
              <button type="button" class="btn-control" disabled>
                <i class="bi bi-gear-fill"></i>
              </button>
              <button type="button" class="btn-control" disabled>
                <i class="bi bi-arrows-fullscreen"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
